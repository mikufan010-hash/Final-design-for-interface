<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Cutout Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Pro editor shell: Photoshop-style menu / options / tools / status bars, Blender-style panels, number sliders and splitters */
:root{
  --chrome:#1b1b1c; --panel:#2a2a2b; --ph:#232324; --field:#1c1c1d; --widget:#39393b; --widget-h:#464648;
  --rule:#121213; --line:#363638; --ink:#d6d6d8; --ink2:#f3f3f4; --mute:#8d8d91; --paste:#1f1f20;
  --accent:#4b8de6; --accent-soft:rgba(75,141,230,.22); --rowsel:#34435c; --danger:#ec6a52; --nav:#ef4a3c;
  --ui:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--rule);color:var(--ink);font:12px/1.35 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
svg{flex:none}
body.scrub,body.scrub *{cursor:ew-resize!important;user-select:none!important}
body.resizing,body.resizing *{user-select:none!important}
body.resizing.col *{cursor:col-resize!important}body.resizing.row *{cursor:row-resize!important}

#app{--libW:248px;--sideW:300px;--pvH:250px;--lyH:250px;height:100%;display:grid;
  grid-template-rows:28px 38px minmax(0,1fr) 24px;
  grid-template-columns:42px var(--libW) 0 minmax(0,1fr) 0 var(--sideW);
  grid-template-areas:"menu menu menu menu menu menu" "opts opts opts opts opts opts" "tools lib s1 center s2 side" "status status status status status status"}

/* menu bar */
#menu{grid-area:menu;display:flex;align-items:center;gap:1px;padding:0 6px;background:var(--chrome);border-bottom:1px solid var(--rule);min-width:0}
.logo{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#d2553a 0 50%,#2f4f9e 50%);margin:0 8px 0 2px;flex:none;position:relative}
.logo::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#efe9dc}
.mb{border:0;background:none;padding:3px 8px;border-radius:4px;color:var(--ink);font-size:12px}
.mb:hover,.mb[aria-expanded="true"]{background:var(--widget)}
#menu .ttl{margin-left:auto;color:var(--mute);font-size:11px;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{position:fixed;min-width:230px;background:#2f2f31;border:1px solid #0c0c0d;border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.55);padding:4px;z-index:70}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:5px 10px 5px 8px;border-radius:4px;text-align:left;color:var(--ink)}
.mi .ck{width:12px;color:var(--accent)}
.mi .lb{flex:1}
.mi kbd{font:inherit;font-size:11px;color:var(--mute)}
.mi:hover:not([disabled]),.mi:focus-visible{background:var(--accent);color:#fff;outline:0}
.mi:hover:not([disabled]) kbd,.mi:focus-visible kbd{color:#e6eeff}
.mi[disabled]{opacity:.38;cursor:default}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* options bar */
#opts{grid-area:opts;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
#optsL{display:flex;align-items:center;gap:6px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
#optsL::-webkit-scrollbar{display:none}
#optsR{display:flex;align-items:center;gap:6px;flex:none}
.otool{display:flex;align-items:center;gap:7px;padding-right:12px;margin-right:4px;border-right:1px solid var(--line);color:var(--ink2);font-weight:600;white-space:nowrap;height:22px}
.otool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.vsep{width:1px;height:20px;background:var(--line);flex:none;margin:0 4px}
.note{color:var(--mute);white-space:nowrap}
#opts .nf{width:96px;flex:none}

/* tools strip */
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
.tb{width:32px;height:30px;border:0;border-radius:4px;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.tb:hover{background:var(--widget)}
.tb[aria-pressed="true"]{background:var(--widget-h);color:#fff;box-shadow:inset 0 0 0 1px #5a5a5d}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.tsep{width:24px;height:1px;background:var(--line);margin:5px 0}
.fgsw{width:24px;height:24px;border-radius:3px;border:1px solid #000;box-shadow:0 0 0 1px #6a6a6d;position:relative;overflow:hidden;margin-top:4px;cursor:pointer}
.fgsw input{position:absolute;inset:-8px;width:40px;height:40px;opacity:0;cursor:pointer}
.fgsw.off{opacity:.35;pointer-events:none}

/* panels */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);overflow:hidden}
.ph{height:28px;flex:none;display:flex;align-items:stretch;background:var(--ph);border-bottom:1px solid var(--rule)}
.pt{display:flex;align-items:center;padding:0 12px;background:var(--panel);color:var(--ink2);font-weight:600;font-size:11.5px;border-right:1px solid var(--rule);white-space:nowrap;margin-bottom:-1px}
.ph .sp{flex:1;min-width:0;display:flex;align-items:center;padding-left:8px;color:var(--mute);font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph .pr{display:flex;align-items:center;gap:4px;padding:0 6px;flex:none}
.ib{width:24px;height:22px;border:0;border-radius:4px;background:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ib:hover:not([disabled]){background:var(--widget);color:var(--ink2)}
.ib[disabled]{opacity:.3;cursor:default}
.ib[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}

#lib{grid-area:lib;border-right:1px solid var(--rule)}
#side{grid-area:side;border-left:1px solid var(--rule);display:grid;grid-template-rows:var(--pvH) 0 var(--lyH) 0 minmax(0,1fr);min-height:0;background:var(--rule)}
#side>.panel{border-bottom:1px solid var(--rule)}

/* splitters */
.split{position:relative;z-index:15;touch-action:none}
.split::before{content:"";position:absolute;inset:0 -4px;cursor:col-resize}
.split::after{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;transition:background .15s}
.split:hover::after,.split.on::after,.split:focus-visible::after{background:var(--accent)}
.split:focus-visible{outline:0}
.split.h::before{inset:-4px 0;cursor:row-resize}.split.h::after{left:0;right:0;top:-1px;bottom:auto;width:auto;height:2px}
#s1{grid-area:s1}#s2{grid-area:s2}

/* number slider (Blender style) */
.nf{position:relative;height:22px;border-radius:4px;background:var(--widget);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;cursor:ew-resize;user-select:none;overflow:hidden;min-width:0;touch-action:none;flex:1}
.nf:hover{background:var(--widget-h)}
.nf i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.5;pointer-events:none}
.nf span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf .l{color:#a9a9ad}.nf .v{color:var(--ink2)}
.nf input{position:absolute;inset:0;width:100%;border:1px solid var(--accent);border-radius:4px;background:var(--field);color:var(--ink2);padding:0 8px;text-align:center;outline:0;cursor:text}
.nf.off{opacity:.4;pointer-events:none}

.btn{height:22px;border:0;border-radius:4px;background:var(--widget);color:var(--ink);padding:0 10px;font-size:11.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn:hover:not([disabled]){background:var(--widget-h);color:var(--ink2)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.pri{background:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#5b9af0;color:#fff}
.btn.warn{color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:#cfe0ff;box-shadow:inset 0 0 0 1px var(--accent)}
.btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.btns .btn{flex:1 1 auto;justify-content:center}
.seg{display:flex;background:var(--field);border-radius:4px;padding:1px;flex:none}
.seg button{border:0;background:none;color:var(--mute);height:20px;padding:0 8px;border-radius:3px;font-size:11px}
.seg button[aria-pressed="true"]{background:var(--widget-h);color:var(--ink2)}
.tip{margin:0;color:var(--mute);line-height:1.5;font-size:11.5px}

/* library */
.lhead{padding:8px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--rule);flex:none}
.search{position:relative;display:block}
.search input{width:100%;height:24px;border:1px solid #111;background:var(--field);border-radius:4px;padding:0 8px 0 26px;font-size:12px;color:var(--ink2)}
.search input::placeholder{color:#6f6f73}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--accent);outline:0}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:12px;height:12px;stroke:var(--mute);fill:none;stroke-width:1.8}
.cats{display:flex;flex-wrap:wrap;gap:3px}
.cats button{border:0;background:var(--widget);border-radius:3px;padding:2px 7px;font-size:11px;color:var(--ink)}
.cats button:hover{background:var(--widget-h)}
.cats button[aria-pressed="true"]{background:var(--accent);color:#fff}
#libBody{overflow-y:auto;padding:2px 8px 16px;flex:1;min-height:0}
.cat{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 0 7px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.cat:first-child{margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tile{border:1px solid #19191a;background:#222223;border-radius:4px;padding:0;cursor:grab;overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;text-align:left;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile canvas{display:block;width:100%;aspect-ratio:1;background:repeating-conic-gradient(#2c2c2e 0 25%,#262628 0 50%) 0 0/12px 12px}
.tile span{font-size:11px;padding:4px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #19191a}
.empty{color:var(--mute);line-height:1.5;padding:10px 2px}

/* centre */
#center{grid-area:center;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paste)}
#tabs{height:30px;flex:none;display:flex;align-items:stretch;background:var(--ph);border-bottom:1px solid var(--rule);min-width:0}
#tabList{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
#tabList::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-right:1px solid var(--rule);color:var(--mute);cursor:pointer;white-space:nowrap;max-width:280px;flex:none;font-size:11.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink2);box-shadow:inset 0 2px 0 var(--accent)}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .zm{color:var(--mute);font-size:11px}
.tab .x{border:0;background:none;color:var(--mute);width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0;font-size:13px}
.tab .x:hover{background:var(--widget-h);color:var(--ink2)}
.tab input{width:130px;height:20px;border:1px solid var(--accent);border-radius:3px;padding:0 5px;background:var(--field);color:var(--ink2);outline:0}
#addTab{border:0;background:none;color:var(--mute);width:30px;font-size:16px;flex:none}
#addTab:hover{color:var(--ink2);background:var(--widget)}
#tabs .sp{flex:1}
#tabs .ib{align-self:center;margin-right:6px}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:var(--paste)}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 10px 34px rgba(0,0,0,.55)}
#art{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#38383b;border:1px solid #111;color:var(--ink2);padding:6px 12px;border-radius:5px;font-size:11.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:5}
#toast.on{opacity:1}

/* right panels */
#pvBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--field)}
#pv{display:block;box-shadow:0 0 0 1px #000;cursor:crosshair;touch-action:none}
.lrow{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--rule);flex:none}
#layers{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto;background:var(--field)}
#layers li{display:grid;grid-template-columns:28px 38px minmax(0,1fr) 26px;align-items:center;height:40px;border-bottom:1px solid #161617;cursor:default;user-select:none;touch-action:none;background:var(--panel)}
#layers li:hover{background:#303032}
#layers li.on{background:var(--rowsel);box-shadow:inset 2px 0 0 var(--accent)}
#layers li.drag{opacity:.5}
#layers li.over-top{box-shadow:inset 0 2px 0 var(--accent)}
#layers li>.eye{height:100%;border-right:1px solid #1d1d1e}
#layers li canvas{width:30px;height:30px;margin-left:6px;display:block;background:repeating-conic-gradient(#3a3a3c 0 25%,#2f2f31 0 50%) 0 0/8px 8px;box-shadow:0 0 0 1px #111}
#layers .ln{padding-left:8px;overflow:hidden;white-space:nowrap}
#layers .ln span{display:block;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
#layers .ln small{display:block;font-size:10.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
#layers .ln input{width:100%;height:20px;border:1px solid var(--accent);border-radius:3px;padding:0 4px;background:var(--field);color:var(--ink2);outline:0}
#layers li button{border:0;background:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
#layers li button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
#layers li button.offv{color:#5d5d61}
#layers li .lk{opacity:0}
#layers li:hover .lk,#layers li .lk.on{opacity:1}
#layers li.bg .ln span{font-style:italic}
.lbar{display:flex;align-items:center;gap:2px;padding:3px 6px;border-top:1px solid var(--rule);background:var(--ph);flex:none}
.lbar .sp{flex:1;color:var(--mute);font-size:11px;padding-left:4px}
#cfBody{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px}
.sub{border-bottom:1px solid var(--line)}
.sub:last-child{border-bottom:0}
.sub>.sh{width:100%;display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--ink2);font-weight:600;font-size:11.5px;text-align:left}
.sub>.sh svg{width:10px;height:10px;fill:none;stroke:var(--mute);stroke-width:1.6;transition:transform .15s}
.sub.closed>.sh svg{transform:rotate(-90deg)}
.sub .sb{padding:0 0 10px;display:flex;flex-direction:column;gap:5px}
.sub.closed .sb{display:none}
.crow{display:flex;gap:6px;align-items:center}
.sw{position:relative;width:22px;height:22px;border-radius:3px;box-shadow:0 0 0 1px #000,0 0 0 2px #59595c;overflow:hidden;flex:none;cursor:pointer;margin:0 2px}
.sw input{position:absolute;inset:-8px;width:40px;height:40px;opacity:0;cursor:pointer}
.fills{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px}
.fills button{border:0;border-radius:3px;padding:0;overflow:hidden;aspect-ratio:1;background:var(--field);box-shadow:0 0 0 1px #000;position:relative}
.fills button canvas{display:block;width:100%;height:100%}
.fills button:hover{box-shadow:0 0 0 1px #000,0 0 0 2px #77777b}
.fills button[aria-pressed="true"]{box-shadow:0 0 0 1px #000,0 0 0 2px var(--accent)}
.fills .none{font-size:10px;color:var(--mute)}
.fills .none::after{content:"";position:absolute;left:-20%;right:-20%;top:50%;height:1px;background:var(--danger);transform:rotate(-45deg);opacity:.7}
.fills .none span{display:none}
.fills .add{font-size:16px;color:var(--mute);background:none;box-shadow:inset 0 0 0 1px #4a4a4d}
.lbl{color:var(--mute);font-size:11px;margin-top:3px}

/* status */
#status{grid-area:status;display:flex;align-items:stretch;background:var(--chrome);border-top:1px solid var(--rule);color:var(--mute);font-size:11px;min-width:0}
#status>*{display:flex;align-items:center;padding:0 10px;border-right:1px solid #2a2a2c;white-space:nowrap}
#status .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;line-height:23px}
#zIn{width:52px;height:18px;border:0;background:transparent;color:var(--ink2);padding:0;font-size:11px}
#zIn:focus{background:var(--field);outline:1px solid var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:#5cb85c;margin-right:6px}

.ghost{position:fixed;width:64px;height:64px;pointer-events:none;z-index:80;transform:translate(-50%,-50%) rotate(-4deg);border-radius:4px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.55);outline:1px solid var(--accent);background:#222}
.ghost canvas{width:100%;height:100%;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:90}
#modal .sheet{background:var(--panel);border:1px solid #0c0c0d;border-radius:8px;max-width:min(640px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#modal header{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border-bottom:1px solid var(--rule);background:var(--ph);font-weight:600;color:var(--ink2)}
#mBody{padding:14px;display:flex;flex-direction:column;gap:10px}
#modal img{max-width:100%;max-height:64vh;display:block;margin:0 auto;box-shadow:0 0 0 1px #000}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12px}
.keys kbd{font:inherit;font-size:11px;background:var(--widget);border-radius:3px;padding:1px 6px;color:var(--ink2);white-space:nowrap;justify-self:start}
.keys h4{grid-column:1/-1;margin:8px 0 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

/* maximise one panel */
#app[data-solo]{grid-template-columns:42px minmax(0,1fr);grid-template-areas:"menu menu" "opts opts" "tools solo" "status status"}
#app[data-solo]>#lib,#app[data-solo]>.split,#app[data-solo]>#center,#app[data-solo]>#side{display:none}
#app[data-solo="lib"]>#lib,#app[data-solo="cv"]>#center{display:flex;grid-area:solo;border:0}
#app[data-solo="pv"]>#side,#app[data-solo="ly"]>#side,#app[data-solo="cf"]>#side{display:grid;grid-area:solo;grid-template-rows:minmax(0,1fr);border:0}
#app[data-solo] #side>*{display:none}
#app[data-solo="pv"] #pvSec,#app[data-solo="ly"] #lySec,#app[data-solo="cf"] #cfSec{display:flex}
.maxb[aria-pressed="true"]{color:var(--accent)}
.drawer{display:none!important}

@media (max-width:900px){
  #app,#app[data-solo]{grid-template-columns:minmax(0,1fr);grid-template-rows:28px 38px minmax(0,1fr);grid-template-areas:"menu" "opts" "center"}
  #tools,#status,.split,.maxb,#menu .ttl{display:none!important}
  #lib,#side{position:fixed;top:66px;bottom:0;width:min(320px,88vw);z-index:20;box-shadow:0 0 40px rgba(0,0,0,.6);transition:transform .2s}
  #lib{left:0;transform:translateX(-105%)}
  #side{right:0;transform:translateX(105%);grid-template-rows:240px 0 260px 0 minmax(320px,auto);overflow-y:auto}
  #lib.open,#side.open{transform:none}
  .drawer{display:inline-flex!important}
  #optsL,#optsR .vsep{display:none}
  #optsR{flex:1;justify-content:space-between}
}

/* panel tabs + web results */
.ptab{border:0;border-right:1px solid var(--rule);background:none;color:var(--mute);font-weight:600;font-size:11.5px;padding:0 12px;margin-bottom:-1px}
.ptab:hover{color:var(--ink)}
.ptab[aria-selected="true"]{background:var(--panel);color:var(--ink2)}
.tile.web img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#2c2c2e 0 25%,#262628 0 50%) 0 0/12px 12px}
.tile.web small{display:block;font-size:10px;color:var(--mute);padding:0 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.web span{border-top:1px solid #19191a}
.tile .del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:3px;border:0;background:rgba(20,20,22,.85);color:var(--ink);display:none;align-items:center;justify-content:center;font-size:13px;padding:0}
.tile{position:relative}
.tile:hover .del{display:flex}
.tile .del:hover{background:var(--danger);color:#fff}
.webmsg{color:var(--mute);line-height:1.55;padding:14px 4px;font-size:11.5px}
.webmsg b{color:var(--ink2);font-weight:600}
.webmore{width:100%;margin-top:8px;justify-content:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* import dialog */
#imp{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:95}
.isheet{width:min(1000px,100%);height:min(660px,100%);background:var(--panel);border:1px solid #0c0c0d;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.isheet header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--rule);background:var(--ph);font-weight:600;color:var(--ink2);flex:none}
.ibody{flex:1;min-height:0;display:flex}
.istage{flex:1;min-width:0;position:relative;background:var(--field)}
#impCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#impMsg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#38383b;border:1px solid #111;color:var(--ink2);padding:6px 12px;border-radius:5px;font-size:11.5px;max-width:calc(100% - 24px);pointer-events:none}
#impMsg:empty{display:none}
.iside{width:300px;flex:none;border-left:1px solid var(--rule);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.meta b{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35}
.meta span{display:block;color:var(--mute);font-size:11px;margin-top:3px;line-height:1.45}
.meta a{color:#8fb6f2}
.iside .seg{width:100%}
.iside .nf,#cfBody .sb>.nf{flex:none}
.iside .seg button{flex:1}
.iside .tf{width:100%;height:24px;border:1px solid #111;border-radius:4px;background:var(--field);color:var(--ink2);padding:0 8px}
.iside .tf:focus{border-color:var(--accent);outline:0}
.chk{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.iside .go{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.iside .go .btn{height:28px;justify-content:center;font-size:12px}
@media (max-width:760px){.ibody{flex-direction:column}.istage{min-height:46vh}.iside{width:auto;border-left:0;border-top:1px solid var(--rule)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ---------- Mineral Garden: procedural motif + ground library ---------- */
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rr=(R,a,b)=>a+(b-a)*R(),ri=(R,a,b)=>Math.floor(rr(R,a,b+1)),pick=(R,arr)=>arr[Math.floor(R()*arr.length)];
const newSeed=()=>(Math.random()*2147483647)|0;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function rgb(hex){hex=hex.replace('#','');return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}
/* shade(hex, amt, alpha): amt>0 lightens toward white, amt<0 darkens */
function shade(hex,amt=0,alpha=1){const c=rgb(hex).map(v=>clamp(Math.round(amt>=0?v+(255-v)*amt:v*(1+amt)),0,255));return`rgba(${c[0]},${c[1]},${c[2]},${alpha})`}
function shadeHex(hex,amt){return'#'+rgb(hex).map(v=>clamp(Math.round(amt>=0?v+(255-v)*amt:v*(1+amt)),0,255).toString(16).padStart(2,'0')).join('')}
const NOISE=(()=>{const c=mk(256,256),g=c.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c})();
function grain(g,w,h,alpha,mode){g.save();g.globalAlpha=alpha;g.globalCompositeOperation=mode||'overlay';g.fillStyle=g.createPattern(NOISE,'repeat');g.fillRect(0,0,w,h);g.restore()}
function grainMasked(t,W,H,alpha){const m=mk(W,H);m.getContext('2d').drawImage(t.canvas,0,0);grain(t,W,H,alpha,'overlay');t.save();t.globalCompositeOperation='destination-in';t.drawImage(m,0,0);t.restore()}
function blot(g,x,y,r,hex,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,shade(hex,0,a));gr.addColorStop(1,shade(hex,0,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function smoothClosed(pts){const p=new Path2D(),n=pts.length;const P=i=>pts[(i+n)%n];p.moveTo((P(0)[0]+P(1)[0])/2,(P(0)[1]+P(1)[1])/2);for(let i=1;i<=n;i++){const a=P(i),b=P(i+1);p.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}p.closePath();return p}
function goldFleck(g,R,x,y,s,pal){const p=new Path2D();for(let k=0;k<4;k++){const a=k/4*TAU+rr(R,-.5,.5),r=s*rr(R,.5,1);k?p.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):p.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}p.closePath();
  const gr=g.createLinearGradient(x-s,y-s,x+s,y+s);gr.addColorStop(0,pal.a);gr.addColorStop(.55,pal.b);gr.addColorStop(1,pal.c);g.fillStyle=gr;g.fill(p);g.strokeStyle=shade(pal.b,-.35,.45);g.lineWidth=.8;g.stroke(p)}
const GOLD={a:'#f6dc8a',b:'#b8862f',c:'#e8c46a'};

/* ---------- petals and flowers ---------- */
function petalP(R,len,wid){const a=rr(R,.8,1.2),b=rr(R,.8,1.2),t=rr(R,.06,.2),p=new Path2D();p.moveTo(0,0);p.bezierCurveTo(-wid*.45*a,-len*.1,-wid*a,-len*.6,-wid*t,-len*.96);p.quadraticCurveTo(0,-len*1.04,wid*t,-len*.96);p.bezierCurveTo(wid*b,-len*.6,wid*.45*b,-len*.1,0,0);p.closePath();return p}
function paintPetal(g,R,len,wid,pal,dark){
  const p=petalP(R,len,wid),gr=g.createLinearGradient(0,0,0,-len);
  gr.addColorStop(0,pal.base);gr.addColorStop(.5,pal.mid);gr.addColorStop(1,pal.tip);g.fillStyle=gr;g.fill(p);
  g.save();g.clip(p);
  if(dark){g.fillStyle=shade(pal.shadow,0,dark);g.fill(p)}
  const side=R()<.5?-1:1,sg=g.createLinearGradient(side*wid,0,-side*wid*.2,0);sg.addColorStop(0,shade(pal.shadow,0,.28));sg.addColorStop(1,shade(pal.shadow,0,0));g.fillStyle=sg;g.fillRect(-wid*1.3,-len*1.1,wid*2.6,len*1.2);
  g.strokeStyle=shade(pal.shadow,0,.16);g.lineWidth=.9;
  for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(k*wid*.05,-len*.04);g.quadraticCurveTo(k*wid*.32,-len*.5,k*wid*.2,-len*.9);g.stroke()}
  g.restore();
  g.strokeStyle=shade(pal.shadow,-.15,.62);g.lineWidth=1.3;g.stroke(p);
}
function magnoliaBloom(g,R,pal){
  g.save();g.strokeStyle='#6a5244';g.lineCap='round';g.lineWidth=9;const sx=rr(R,-34,34);g.beginPath();g.moveTo(0,8);g.quadraticCurveTo(sx*.4,60,sx,118);g.stroke();
  g.fillStyle='#5a463b';g.beginPath();g.ellipse(0,6,17,10,0,0,TAU);g.fill();g.restore();
  const n=ri(R,6,8),nf=ri(R,2,3),back=[],front=[];
  for(let i=0;i<n;i++)back.push({a:rr(R,-78,78)*Math.PI/180,len:rr(R,150,200),wid:rr(R,44,62)});
  for(let i=0;i<nf;i++)front.push({a:rr(R,-48,48)*Math.PI/180,len:rr(R,100,138),wid:rr(R,54,72)});
  back.sort((p,q)=>Math.abs(q.a)-Math.abs(p.a));front.sort((p,q)=>Math.abs(q.a)-Math.abs(p.a));
  for(const p of back){g.save();g.rotate(p.a);paintPetal(g,R,p.len,p.wid,pal,.07);g.restore()}
  g.save();g.translate(rr(R,-6,6),-34);g.fillStyle=shade(pal.stamen,-.15);g.beginPath();g.ellipse(0,0,11,30,0,0,TAU);g.fill();
  for(let k=0;k<26;k++){g.fillStyle=shade(pal.stamen,rr(R,-.1,.45));g.beginPath();g.arc(rr(R,-9,9),rr(R,-26,26),rr(R,1.2,2.6),0,TAU);g.fill()}g.restore();
  for(const p of front){g.save();g.rotate(p.a);paintPetal(g,R,p.len,p.wid,pal,0);g.restore()}
  for(let k=0;k<ri(R,1,3);k++)goldFleck(g,R,rr(R,-50,50),rr(R,-120,-30),rr(R,5,11),GOLD);
}
function magnoliaBud(g,R,pal){
  g.save();g.strokeStyle='#6a5244';g.lineCap='round';g.lineWidth=7;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(rr(R,-14,14),40,rr(R,-20,20),84);g.stroke();
  g.fillStyle='#6b5446';g.beginPath();g.ellipse(0,-6,15,24,0,0,TAU);g.fill();
  g.strokeStyle='rgba(205,190,160,.5)';g.lineWidth=.8;for(let k=0;k<40;k++){const x=rr(R,-12,12),y=rr(R,-26,10);g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(R,-3,3),y-rr(R,3,6));g.stroke()}g.restore();
  const ps=[{a:-.2,len:rr(R,150,180),wid:rr(R,30,38)},{a:.18,len:rr(R,145,175),wid:rr(R,30,38)},{a:rr(R,-.06,.06),len:rr(R,160,190),wid:rr(R,34,42)}];
  ps.forEach((p,i)=>{g.save();g.translate(0,-10);g.rotate(p.a);paintPetal(g,R,p.len,p.wid,pal,i<2?.06:0);g.restore()});
  if(R()<.7)goldFleck(g,R,rr(R,-14,14),rr(R,-120,-60),rr(R,4,8),GOLD);
}

/* ---------- branches ---------- */
function drawLimbs(g,R,pal,W,H,o){
  const tmp=mk(W,H),t=tmp.getContext('2d');t.lineCap='round';t.lineJoin='round';const segs=[],ends=[];
  function grow(x,y,a,w,steps,depth){
    const pts=[[x,y]];let ang=a;
    for(let i=0;i<steps;i++){ang+=rr(R,-.15,.15)+(i%6===0?rr(R,-.22,.22):0);x+=Math.cos(ang)*o.step;y+=Math.sin(ang)*o.step;
      if(x<w||x>W-w||y<w||y>H-w)break;pts.push([x,y])}
    const N=pts.length-1;if(N<2)return;
    if(depth<o.depth){const kids=ri(R,1,o.kids-depth);for(let k=0;k<kids;k++){const i=ri(R,Math.floor(N*.25),Math.max(Math.floor(N*.25),N-2)),p=pts[i],q=pts[Math.min(N,i+1)],da=Math.atan2(q[1]-p[1],q[0]-p[0]);
      grow(p[0],p[1],da+(R()<.5?-1:1)*rr(R,.45,1),w*(1-i/N*.8)*.6,Math.floor(N*rr(R,.3,.6)),depth+1)}}
    for(let i=0;i<N;i++){const lw=Math.max(1.5,w*(1-i/N*.85));t.strokeStyle=pal.bark;t.lineWidth=lw;t.beginPath();t.moveTo(pts[i][0],pts[i][1]);t.lineTo(pts[i+1][0],pts[i+1][1]);t.stroke();segs.push([pts[i],pts[i+1],lw])}
    const e=pts[N],f=pts[N-1];ends.push({x:e[0],y:e[1],a:Math.atan2(e[1]-f[1],e[0]-f[0]),w:Math.max(1.5,w*.15)});
  }
  grow(o.x,o.y,o.a,o.w,o.steps,0);
  t.globalCompositeOperation='source-atop';
  for(const[p,q,lw]of segs){const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
    for(let k=0;k<3;k++){const off=rr(R,-.45,.45)*lw,dark=R()<.55;t.strokeStyle=dark?shade(pal.dark,0,rr(R,.25,.5)):shade(pal.light,0,rr(R,.2,.4));t.lineWidth=rr(R,.8,Math.max(1,lw*.14));t.beginPath();t.moveTo(p[0]+nx*off,p[1]+ny*off);t.lineTo(q[0]+nx*off+rr(R,-2,2),q[1]+ny*off+rr(R,-2,2));t.stroke()}
    if(R()<.12&&lw>6){t.fillStyle=shade(pal.lichen,0,rr(R,.35,.6));t.beginPath();t.ellipse(p[0]+nx*rr(R,-.3,.3)*lw,p[1]+ny*rr(R,-.3,.3)*lw,rr(R,2,lw*.45),rr(R,1.5,lw*.3),Math.atan2(dy,dx),0,TAU);t.fill()}}
  t.globalCompositeOperation='source-over';grainMasked(t,W,H,.22);
  g.save();g.globalAlpha=pal.alpha;g.drawImage(tmp,0,0);g.restore();
  return ends;
}
function branch(g,R,pal,W,H){drawLimbs(g,R,pal,W,H,{x:W*.04,y:H*rr(R,.62,.82),a:rr(R,-.42,-.2),w:44,step:22,steps:Math.floor(W*.95/22),depth:2,kids:4})}
function twig(g,R,pal,W,H){
  const ends=drawLimbs(g,R,pal,W,H,{x:W*.05,y:H*.82,a:rr(R,-.55,-.3),w:13,step:16,steps:Math.floor(W*.8/16),depth:1,kids:3});

function spray(g,R,pal,W,H){

  const tips=[];
  for(let i=0,n=ri(R,3,6);i<n;i++){const len=rr(R,H*.35,H*.9),dx=rr(R,-W*.38,W*.38);let px=ax+rr(R,-20,20),py=ay;g.lineWidth=1.4;g.beginPath();g.moveTo(px,py);
    const steps=12;for(let s=1;s<=steps;s++){const t=s/steps,nx=ax+dx*t*t+rr(R,-6,6),ny=ay+len*t;g.lineTo(nx,ny);
      if(R()<.45){const bl=rr(R,18,60),ba=Math.PI/2+(R()<.5?-1:1)*rr(R,.5,1.2);g.moveTo(nx,ny);g.lineTo(nx+Math.cos(ba)*bl,ny+Math.sin(ba)*bl);tips.push([nx+Math.cos(ba)*bl,ny+Math.sin(ba)*bl]);g.moveTo(nx,ny)}
      px=nx;py=ny}
    g.stroke();tips.push([px,py])}
  for(const[x,y]of tips){const n=ri(R,1,3);for(let k=0;k<n;k++){const fx=x+rr(R,-8,8),fy=y+rr(R,-8,8),r=rr(R,4,8);
    if(R()<.3){g.fillStyle=pal.c;g.beginPath();g.ellipse(fx,fy,r*.45,r*.7,R(),0,TAU);g.fill();continue}
    const rot=R()*TAU;for(let p=0;p<5;p++){const a=rot+p/5*TAU;g.fillStyle=pal.c;g.beginPath();g.ellipse(fx+Math.cos(a)*r*.6,fy+Math.sin(a)*r*.6,r*.5,r*.36,a,0,TAU);g.fill()}
    g.fillStyle=pal.center;g.beginPath();g.arc(fx,fy,r*.22,0,TAU);g.fill()}}
}

/* ---------- leaves ---------- */
function bez(p0,p1,p2,p3,t){const u=1-t;return[u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]}

  const gr=g.createLinearGradient(-w,0,w,0);gr.addColorStop(0,shade(col,-.12));gr.addColorStop(.6,col);gr.addColorStop(1,shade(col,.18));g.fillStyle=gr;g.fill(p);
  g.strokeStyle=shade(col,-.35,.35);g.lineWidth=.8;g.stroke(p);g.strokeStyle=shade(col,.35,.55);g.beginPath();g.moveTo(0,2);g.quadraticCurveTo(w*.12,L*.5,0,L*.92);g.stroke();g.restore();
}
function willow(g,R,pal,W,H){
  const stems=[];const p0=[W*rr(R,.1,.25),12],p3=[W*rr(R,.6,.85),H-20],p1=[W*rr(R,.2,.6),H*.3],p2=[W*rr(R,.3,.9),H*.65];stems.push([p0,p1,p2,p3]);
  const q0=bez(p0,p1,p2,p3,rr(R,.2,.35));stems.push([q0,[q0[0]+rr(R,-160,60),q0[1]+H*.2],[q0[0]+rr(R,-200,40),q0[1]+H*.4],[clamp(q0[0]+rr(R,-260,0),30,W-30),Math.min(H-30,q0[1]+H*.55)]]);
  for(const s of stems){g.strokeStyle=pal.stem;g.lineWidth=2;g.beginPath();for(let i=0;i<=40;i++){const p=bez(...s,i/40);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke()}
  for(const s of stems)for(let i=3;i<=40;i++){const t=i/40,p=bez(...s,t),q=bez(...s,Math.min(1,t+.02)),tan=Math.atan2(q[1]-p[1],q[0]-p[0]);
    for(const side of[-1,1]){if(R()<.25)continue;const dir=tan+side*rr(R,.35,.95),L=rr(R,70,150)*(.55+.45*Math.sin(t*Math.PI)),w=rr(R,8,17);leafAt(g,R,p[0],p[1],dir,L,w,pick(R,pal.leaves),rr(R,.78,.96))}}

function roundLeaves(g,R,pal,W,H){
  const s=[[W*rr(R,.35,.6),10],[W*rr(R,.2,.8),H*.3],[W*rr(R,.2,.8),H*.66],[W*rr(R,.3,.7),H-24]];
  g.strokeStyle=pal.stem;g.lineWidth=2.4;g.beginPath();for(let i=0;i<=40;i++){const p=bez(...s,i/40);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();
  for(let i=2;i<=38;i+=ri(R,2,3)){const t=i/40,p=bez(...s,t),q=bez(...s,t+.02),tan=Math.atan2(q[1]-p[1],q[0]-p[0]);
    for(const side of[-1,1]){if(R()<.15)continue;const rx=rr(R,20,36)*(1-t*.35),ry=rx*rr(R,.78,1),off=rx*.85,cx=p[0]+Math.cos(tan+side*Math.PI/2)*off,cy=p[1]+Math.sin(tan+side*Math.PI/2)*off,col=pick(R,pal.leaves);
      const gr=g.createRadialGradient(cx-rx*.3,cy-ry*.3,1,cx,cy,rx*1.1);gr.addColorStop(0,shade(col,.2));gr.addColorStop(1,shade(col,-.12));g.globalAlpha=rr(R,.82,.97);g.fillStyle=gr;g.beginPath();g.ellipse(cx,cy,rx,ry,tan,0,TAU);g.fill();
      g.strokeStyle=shade(col,-.35,.4);g.lineWidth=.9;g.stroke();g.strokeStyle=shade(col,.4,.5);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(cx+(cx-p[0])*.6,cy+(cy-p[1])*.6);g.stroke();g.globalAlpha=1}}

function hydrangea(g,R,pal,W,H){
  const cx=W/2,cy=H*.5,rx=W*.4,ry=H*.36;
  for(const s of[-1,1]){g.save();g.translate(cx+s*rx*.55,cy+ry*.65);g.rotate(s*rr(R,.6,1.1)+Math.PI/2);const L=rr(R,130,170),w=L*.33,p=new Path2D();p.moveTo(0,0);p.bezierCurveTo(w,L*.2,w*.8,L*.8,0,L);p.bezierCurveTo(-w*.8,L*.8,-w,L*.2,0,0);
    g.fillStyle=pal.leaf;g.fill(p);g.strokeStyle=shade(pal.leaf,.3,.5);g.lineWidth=1.2;g.beginPath();g.moveTo(0,4);g.lineTo(0,L*.92);for(let k=1;k<6;k++){g.moveTo(0,L*k/6.5);g.lineTo(w*.55,L*k/6.5+18);g.moveTo(0,L*k/6.5);g.lineTo(-w*.55,L*k/6.5+18)}g.stroke();g.restore()}
  const fs=[];for(let i=0,n=ri(R,80,110);i<n;i++){const a=R()*TAU,r=Math.sqrt(R());fs.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}

    g.fillStyle=shade(col,-.45);g.beginPath();g.arc(0,0,2.2,0,TAU);g.fill();g.restore()}

function maple(g,R,pal,W,H){

  p.moveTo(cx,cy+8);
  ang.forEach((a,k)=>{const s0=a-.27,tip=[cx+Math.cos(a)*Rm*lens[k],cy+Math.sin(a)*Rm*lens[k]],sin=[cx+Math.cos(s0)*Rm*.34,cy+Math.sin(s0)*Rm*.34];
    p.lineTo(sin[0],sin[1]);for(let z=1;z<=3;z++){const t=z/4,bx=sin[0]+(tip[0]-sin[0])*t,by=sin[1]+(tip[1]-sin[1])*t,na=a-Math.PI/2;p.lineTo(bx+Math.cos(na)*3.5,by+Math.sin(na)*3.5);p.lineTo(bx+Math.cos(na)*1,by+Math.sin(na)*1)}
    p.lineTo(tip[0],tip[1]);const s1=a+.27,sout=[cx+Math.cos(s1)*Rm*.34,cy+Math.sin(s1)*Rm*.34];
    for(let z=3;z>=1;z--){const t=z/4,bx=sout[0]+(tip[0]-sout[0])*t,by=sout[1]+(tip[1]-sout[1])*t,na=a+Math.PI/2;p.lineTo(bx+Math.cos(na)*3.5,by+Math.sin(na)*3.5);p.lineTo(bx+Math.cos(na)*1,by+Math.sin(na)*1)}});

  g.strokeStyle=shade(pal.vein,0,.7);g.lineWidth=1.6;ang.forEach((a,k)=>{g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*Rm*lens[k]*.92,cy+Math.sin(a)*Rm*lens[k]*.92);g.stroke()});

function gStone(g,w,h,R){g.fillStyle='#bab5aa';g.fillRect(0,0,w,h);for(let i=0,n=Math.ceil(w*h/9000);i<n;i++)blot(g,rr(R,0,w),rr(R,0,h),rr(R,40,190),pick(R,['#9d978b','#d3cec4','#a8a093','#c9c3b6','#8f887c']),rr(R,.15,.4));
  for(let i=0,n=Math.ceil(w*h/60000);i<n;i++){const x=rr(R,0,w),y=rr(R,0,h),big=R()<.18,r0=big?rr(R,30,70):rr(R,6,24),pts=[];for(let k=0,m=ri(R,6,9);k<m;k++){const a=k/m*TAU,r=r0*rr(R,.55,1.25);pts.push([x+Math.cos(a)*r,y+Math.sin(a)*r*rr(R,.6,1)])}
    const p=smoothClosed(pts);g.save();g.translate(2,3);g.fillStyle='rgba(95,86,74,.45)';g.fill(p);g.restore();
    const inner=R()<.22?'#3f7f78':shadeHex('#9a9284',rr(R,-.12,.05));g.fillStyle=inner;g.fill(p);g.save();g.clip(p);blot(g,x-r0*.3,y-r0*.3,r0*1.2,inner==='#3f7f78'?'#6aa79c':'#c8c1b3',.5);g.restore();g.strokeStyle='rgba(225,219,206,.7)';g.lineWidth=1.4;g.stroke(p)}
  for(let i=0,n=Math.ceil(w*h/4000);i<n;i++){g.fillStyle=R()<.5?'rgba(80,72,62,.35)':'rgba(240,236,228,.4)';g.beginPath();g.arc(rr(R,0,w),rr(R,0,h),rr(R,.6,2.2),0,TAU);g.fill()}
  grain(g,w,h,.16,'overlay')}
function gWash(base,dark,light){return(g,w,h,R)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0,n=Math.ceil(w*h/14000);i<n;i++)blot(g,rr(R,0,w),rr(R,0,h),rr(R,60,240),R()<.5?dark:light,rr(R,.12,.35));
  for(let k=0,n=Math.ceil(h/40);k<n;k++){const y0=rr(R,0,h),amp=rr(R,6,30),fr=rr(R,.004,.012),ph=R()*TAU;g.strokeStyle=shade(R()<.6?dark:light,0,rr(R,.12,.3));g.lineWidth=rr(R,1.5,9);g.beginPath();for(let x=0;x<=w;x+=12){const y=y0+Math.sin(x*fr+ph)*amp+Math.sin(x*fr*2.7+ph)*amp*.4;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
  grain(g,w,h,.16,'overlay')}}
function gFelt(base){return(g,w,h,R)=>{g.fillStyle=base;g.fillRect(0,0,w,h);const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,.05)');gr.addColorStop(1,'rgba(0,0,0,.12)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0,n=Math.ceil(w*h/90);i<n;i++){g.fillStyle=R()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.12)';g.fillRect(rr(R,0,w),rr(R,0,h),rr(R,1,2.5),rr(R,1,2.5))}grain(g,w,h,.16,'overlay')}}
function gMist(g,w,h,R){g.fillStyle='#ccd3c4';g.fillRect(0,0,w,h);for(let i=0,n=Math.ceil(w*h/8000);i<n;i++)blot(g,rr(R,0,w),rr(R,0,h),rr(R,50,200),pick(R,['#aebca9','#e5e8de','#b9c4c4','#d9d6c5']),rr(R,.2,.5));
  for(let i=0,n=Math.ceil(w*h/3000);i<n;i++){g.fillStyle='rgba(60,70,60,.25)';g.beginPath();g.arc(rr(R,0,w),rr(R,0,h),rr(R,.5,1.6),0,TAU);g.fill()}grain(g,w,h,.14,'overlay')}
function gWashi(g,w,h,R){g.fillStyle='#ece3cf';g.fillRect(0,0,w,h);for(let i=0,n=Math.ceil(w*h/2500);i<n;i++){const x=rr(R,0,w),y=rr(R,0,h),a=R()*TAU,l=rr(R,8,40);g.strokeStyle=R()<.6?'rgba(255,255,255,.45)':'rgba(150,130,100,.14)';g.lineWidth=rr(R,.5,1.4);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*.5,y+Math.sin(a+1)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}grain(g,w,h,.12,'overlay')}
function gLeaf(pal,tarnish){return(g,w,h,R)=>{leafSquares(g,R,pal,w,h,Math.max(40,Math.round(Math.min(w,h)/10)));if(tarnish)for(let i=0,n=Math.ceil(w*h/30000);i<n;i++)blot(g,rr(R,0,w),rr(R,0,h),rr(R,30,120),tarnish,rr(R,.08,.22));grain(g,w,h,.16,'overlay')}}
function gFlat(hex){return(g,w,h,R)=>{g.fillStyle=hex;g.fillRect(0,0,w,h);for(let i=0,n=Math.ceil(w*h/30000);i<n;i++)blot(g,rr(R,0,w),rr(R,0,h),rr(R,80,260),R()<.5?shadeHex(hex,-.12):shadeHex(hex,.1),rr(R,.05,.14));grain(g,w,h,.12,'overlay')}}

/* draw an opaque mask, then give it a paper surface: colour, uneven tone, grain, a soft cut edge */
function paperCut(g,R,pal,W,H,mask,extra){
  const t=mk(W,H),tg=t.getContext('2d');tg.fillStyle='#000';mask(tg);
  tg.globalCompositeOperation='source-atop';tg.fillStyle=pal.c;tg.fillRect(0,0,W,H);
  for(let i=0;i<14;i++)blot(tg,rr(R,0,W),rr(R,0,H),rr(R,40,160),R()<.5?shadeHex(pal.c,-.12):shadeHex(pal.c,.14),rr(R,.18,.4));
  if(extra)extra(tg);
  tg.globalCompositeOperation='source-over';grainMasked(tg,W,H,.22);
  g.save();g.shadowColor='rgba(0,0,0,.28)';g.shadowBlur=1.5;g.shadowOffsetX=.6;g.shadowOffsetY=.8;g.drawImage(t,0,0);g.restore();
}
function polyPath(t,pts){t.beginPath();pts.forEach((p,i)=>i?t.lineTo(p[0],p[1]):t.moveTo(p[0],p[1]));t.closePath()}
function jitter(R,pts,a){return pts.map(([x,y])=>[x+rr(R,-a,a),y+rr(R,-a,a)])}
const SHAPES={

 bird:(g,R,p,W,H)=>paperCut(g,R,p,W,H,t=>{const s=W*.46,cx=W/2,cy=H/2,P=[[-.95,.05],[-.55,-.12],[-.2,-.18],[.1,-.62-rr(R,0,.2)],[.32,-.58],[.22,-.2],[.55,-.28],[.78,-.36],[.95,-.3],[.7,-.12],[.5,.12],[.15,.3],[-.35,.28],[-.7,.18]].map(([x,y])=>[cx+x*s,cy+y*s]);t.fill(smoothClosed(jitter(R,P,3)))},t=>{t.fillStyle='rgba(0,0,0,.75)';t.beginPath();t.arc(W/2+W*.46*.72,H/2-W*.46*.24,4,0,TAU);t.fill()}),

function registerCustom(o,img){const pad=14,W=img.naturalWidth+pad*2,H=img.naturalHeight+pad*2;
  const m={id:o.id,name:o.name,tags:'my cut-out web '+((o.credit&&o.credit.source)||''),cat:'mine',W,H,size:420,pals:[0],credit:o.credit||null,custom:true,src:o.src,
    draw(g){g.save();g.shadowColor='rgba(40,30,20,.24)';g.shadowBlur=9;g.shadowOffsetY=4;g.drawImage(img,pad,pad);g.restore()}};
  const i=MOTIFS.findIndex(x=>x.id===o.id);if(i>=0)MOTIFS.splice(i,1);MOTIFS.push(m);MOT[o.id]=m;THUMB.delete(o.id);return m}
function saveCustoms(){return store.set('custom',MOTIFS.filter(m=>m.custom).map(m=>({id:m.id,name:m.name,src:m.src,credit:m.credit})))}
function saveMine(){return store.set('mine',[...MINE.values()].map(u=>({id:u.id,name:u.name,src:u.src,credit:u.credit||null})))}
function encode(c){let s='';try{s=c.toDataURL('image/webp',.9)}catch(e){}if(!s.startsWith('data:image/webp'))s=c.toDataURL('image/png');return s}
function shrink(c,lim){const k=Math.min(1,lim/Math.max(c.width,c.height));if(k>=1)return c;const o=mk(Math.round(c.width*k),Math.round(c.height*k)),g=o.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(c,0,0,o.width,o.height);return o}

  const r=impResult();if(!r)return;const at=IMP.at,name=(IMP.name||'Cut-out').trim().slice(0,32);closeImport();const id=await addCustom(r,name,credit);place(id,at&&at.x,at&&at.y);toast(`“${name}” added to My cut-outs`)}
function credits(){const f=F(),seen=new Map();const add=c=>{if(c&&!seen.has(c.title+c.page))seen.set(c.title+c.page,c)};
  for(const L of f.layers){add(MOT[L.m]&&MOT[L.m].credit);if(L.fill&&L.fill.src.startsWith('u:'))add((MINE.get(L.fill.src.slice(2))||{}).credit)}if(f.bg.t==='u')add((MINE.get(f.bg.id)||{}).credit);
  $('#mTitle').textContent='Image credits · '+f.name;const b=$('#mBody');b.innerHTML='';
  if(!seen.size){b.appendChild(el('p','tip','This file doesn’t use any images from the web yet.'))}
  else for(const c of seen.values()){const d=el('div','meta','<b></b><span></span>');d.querySelector('b').textContent=c.title;const s=d.querySelector('span');s.textContent=(c.creator||'Unknown maker')+' · '+c.license+' · '+c.source+(c.page?' · ':'');if(c.page){const a=el('a');a.href=c.page;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Source ↗';s.appendChild(a)}b.appendChild(d)}
  $('#modal').hidden=false}

/* ---------- samples ---------- */
function samples(){
  const a=newFile('Window collage',{t:'g',id:'washi',seed:newSeed()}),q={quiet:true};
  addLayer(a,'arch',560,1180,Object.assign({pal:1,sm:2.6,rot:0},q));addLayer(a,'circle',1020,520,Object.assign({pal:0,sm:1.5,rot:0},q));
  addLayer(a,'willow',1050,1250,Object.assign({pal:0,sm:1.2},q));
  addLayer(a,'magnolia',420,700,Object.assign({pal:0,sm:1.1},q));addLayer(a,'bird',820,880,Object.assign({pal:5,sm:1.2,rot:-.15},q));
  const st=addLayer(a,'star',1220,1640,Object.assign({pal:2,sm:1},q));st.fill={src:'g:goldleaf',ox:0,oy:0,s:1.4,keep:.4};
  addLayer(a,'letter',300,1650,Object.assign({pal:0,sm:1.4,rot:-.2},q));addLayer(a,'flecks',760,560,Object.assign({sm:1.2},q));
  a.layers.forEach((L,i)=>L.name='Layer '+(i+1));
  const b=newFile('Night garden',{t:'g',id:'indigo',seed:newSeed()});
  addLayer(b,'moon',1050,450,Object.assign({pal:6,sm:1.4,rot:-.3},q));addLayer(b,'wave',750,1500,Object.assign({pal:4,sm:2.4,rot:0},q));addLayer(b,'fish',520,1250,Object.assign({pal:2,sm:1.4},q));
  const h=addLayer(b,'hydrangea',1000,1100,Object.assign({pal:0,sm:1.1},q));h.tint={c:'#e8b4a8',amt:.6};addLayer(b,'eye',520,620,Object.assign({pal:6,sm:1.3,rot:.1},q));
  b.layers.forEach((L,i)=>L.name='Layer '+(i+1));
  return[a,b];
}

/* ---------- boot ---------- */
async function boot(){
  for(const u of store.get('mine',[])){await new Promise(r=>{const img=new Image();img.onload=()=>{MINE.set(u.id,{id:u.id,name:u.name,src:u.src,img,credit:u.credit||null});UID=Math.max(UID,(parseInt(u.id.slice(1))||0)+1);r()};img.onerror=r;img.src=u.src})}
  for(const o of store.get('custom',[])){await new Promise(r=>{const img=new Image();img.onload=()=>{registerCustom(o,img);CID=Math.max(CID,(parseInt(o.id.slice(1))||0)+1);r()};img.onerror=r;img.src=o.src})}
  const saved=store.get('files',null);
  if(saved&&saved.files&&saved.files.length){FILES=saved.files.map(s=>{const f=newFile(s.name);load(f,s);return f});A=clamp(saved.A||0,0,FILES.length-1)}else FILES=samples();
  FILES.forEach(f=>{const k=JSON.stringify(snap(f));f.hist={list:[k],i:0}});
  renderLib();setTool('move');afterSwitch();requestAnimationFrame(frame);
}
boot();
window.__cs={openImport,IMP:()=>IMP,WEB,setLibMode,F,FILES:()=>FILES,select,place,setTool,V,VK:()=>VK,zoomAt};
})();
